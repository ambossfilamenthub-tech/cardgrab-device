name: Preise aktualisieren & App veröffentlichen

on:
  schedule:
    - cron: "23 6 * * *"   # täglich ~07:23 Uhr deutscher Zeit (Cardmarket veröffentlicht morgens)
  workflow_dispatch:         # manuell starten: Actions → "Preise aktualisieren" → Run workflow
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-24.04          # feste Version statt "latest" – kein Überraschungs-Wechsel
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Texterkennung (Tesseract-Kern) bereitstellen
        run: |
          npm i --no-save --no-package-lock tesseract.js@5.1.1 tesseract.js-core@5.1.1
          mkdir -p site/lib/core
          cp node_modules/tesseract.js-core/tesseract-core-simd-lstm.wasm.js node_modules/tesseract.js-core/tesseract-core-lstm.wasm.js site/lib/core/

      # Die folgenden Datenschritte dürfen einzeln ausfallen – dann wird die Version vom Vortag übernommen.
      - name: Vorlese-Daten (TCGdex) bauen
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/tcgdex/cards-database.git /tmp/tcgdex
          node scripts/build-facts.mjs /tmp/tcgdex/data site/facts

      - name: Yu-Gi-Oh!-Datenbank (YGOPRODeck) bauen
        continue-on-error: true
        run: node scripts/build-ygo.mjs

      - name: Selbst gespeicherte Kartenbilder entfernen (Bilder werden nur verlinkt)
        run: |
          git config user.name "cardgrab-bot"
          git config user.email "actions@users.noreply.github.com"
          if git ls-files --error-unmatch site/img >/dev/null 2>&1; then git rm -r -q site/img data/img-missing.json || true; fi
          rm -rf site/img

      - name: Kartentexte ins Deutsche übersetzen (offline, mit Cache)
        continue-on-error: true
        run: |
          pip install -q ctranslate2 sentencepiece
          python3 scripts/translate-de.py

      - name: Cardmarket-Preise laden
        continue-on-error: true
        run: node scripts/update-prices.mjs

      - name: Ausgefallene Daten von der Live-Seite übernehmen
        run: bash scripts/ensure-data.sh

      - name: Prüfung vor dem Veröffentlichen
        run: node scripts/check-site.mjs

      - name: Preise speichern
        run: |
          git config user.name "cardgrab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/prices-*.json data/tr-de.json
          git diff --cached --quiet || git commit -q -m "Preise $(date -u +%F)"
          git push || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
